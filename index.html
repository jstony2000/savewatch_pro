<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SaveWatch Plus 2 • Setup Hub Pro</title>
  <style>
    :root {
      --bg-main: #070b14;
      --bg-card: #111927;
      --bg-card-secondary: #1a2333;
      --bg-input: #0b111e;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #10b981;
      --accent-muted: rgba(16, 185, 129, 0.15);
      --danger: #f87171;
      --warning: #fbbf24;
      --purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-focus: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 12px;
    }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 95vh;
    }

    header {
      background: linear-gradient(135deg, #0b111e 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .progress-track {
      background: #1e293b;
      height: 5px;
      width: 100%;
    }
    .progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .step-nav {
      display: flex;
      overflow-x: auto;
      background: #090e17;
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      gap: 6px;
      scrollbar-width: none;
    }
    .step-nav::-webkit-scrollbar { display: none; }

    .step-pill {
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .step-pill.active {
      background: var(--primary);
      color: #070b14;
      border-color: var(--primary);
      font-weight: 700;
    }

    .step-pill.completed {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-muted);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    @media (min-width: 850px) {
      .workspace {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .panel-instructions {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .phase-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--primary);
    }

    .phase-title {
      font-size: 1.2rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .instruction-card {
      background: var(--bg-card-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.85rem;
    }

    .instruction-card h4 {
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .instruction-card ol, .instruction-card ul {
      padding-left: 18px;
      margin-top: 6px;
      color: #cbd5e1;
    }

    .instruction-card li { margin-bottom: 6px; }

    .completion-toggle {
      background: #0b111e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .completion-toggle.done {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--accent);
    }

    .completion-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .completion-toggle label {
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    .data-box {
      background: #0b111e;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .data-box h4 {
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-input);
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--primary); }

    .btn-native {
      background: #1e293b;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-native:hover {
      background: var(--primary);
      color: #070b14;
    }

    .btn-native.success {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-muted);
    }

    .btn-native.purple {
      color: var(--purple);
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.15);
    }

    .panel-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .mockup-watch {
      width: 240px;
      height: 280px;
      background: #020617;
      border-radius: 40px;
      border: 4px solid #334155;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .watch-screen {
      background: #000000;
      flex: 1;
      border-radius: 26px;
      padding: 8px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.7rem;
    }

    .mockup-phone {
      width: 230px;
      height: 330px;
      background: #020617;
      border-radius: 32px;
      border: 3px solid #334155;
      padding: 6px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .phone-screen {
      background: #0f172a;
      flex: 1;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      font-size: 0.7rem;
    }

    .phone-topbar {
      background: #1e293b;
      color: var(--primary);
      padding: 6px;
      font-weight: bold;
      text-align: center;
    }

    .phone-body {
      padding: 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: #090e17;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #070b14; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #1e293b; color: var(--text-main); }
    .btn:disabled { background: #111927; color: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div>
      <h1>SaveWatch Plus 2 • Setup Hub Pro</h1>
      <p>Red Digi Mobil • Poio • IA, MeteoKid, WhatsApp, GPS & Control Total</p>
    </div>
    <div class="header-actions">
      <button class="btn-native success" onclick="shareViaUrl()">🔗 Compartir / Guardar en Enlace</button>
      <button class="btn-native" onclick="exportConfig()">📤 Copiar Código</button>
      <button class="btn-native" onclick="importConfig()">📥 Pegar Código</button>
    </div>
  </header>

  <div class="progress-track">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="step-nav" id="step-nav">
    <button class="step-pill active" onclick="setStep(0)"><span>1. Desbloqueo</span></button>
    <button class="step-pill" onclick="setStep(1)"><span>2. Montaje</span></button>
    <button class="step-pill" onclick="setStep(2)"><span>3. Wi-Fi</span></button>
    <button class="step-pill" onclick="setStep(3)"><span>4. APN 4G</span></button>
    <button class="step-pill" onclick="setStep(4)"><span>5. App Oficial</span></button>
    <button class="step-pill" onclick="setStep(5)"><span>6. Agenda SOS</span></button>
    <button class="step-pill" onclick="setStep(6)"><span>7. Calibración GPS</span></button>
    <button class="step-pill" onclick="setStep(7)"><span>8. WhatsApp Pro</span></button>
    <button class="step-pill" onclick="setStep(8)"><span>9. Asistente IA</span></button>
    <button class="step-pill" onclick="setStep(9)"><span>10. MeteoKid</span></button>
    <button class="step-pill" onclick="setStep(10)"><span>11. Modo Clase</span></button>
    <button class="step-pill" onclick="setStep(11)"><span>12. Alarmas</span></button>
  </div>

  <div class="workspace">
    <div class="panel-instructions">
      <div>
        <span class="phase-badge" id="step-badge">Fase 1 / 12</span>
        <h2 class="phase-title" id="step-title"></h2>
      </div>

      <div class="completion-toggle" id="completion-box" onclick="toggleCompletion()">
        <input type="checkbox" id="chk-done" onclick="event.stopPropagation(); toggleCompletion();">
        <label for="chk-done" id="chk-label">Marcar paso como REALIZADO</label>
      </div>

      <div class="instruction-card" id="instruction-content"></div>
      <div class="data-box" id="data-container"></div>
    </div>

    <div class="panel-preview">
      <span style="font-size:0.7rem; color:var(--text-muted); margin-bottom:8px;" id="preview-tag"></span>
      <div id="device-wrapper"></div>
    </div>
  </div>

  <div class="nav-footer">
    <button class="btn btn-secondary" id="btn-prev" onclick="moveStep(-1)" disabled>Anterior</button>
    <button class="btn btn-primary" id="btn-next" onclick="moveStep(1)">Siguiente</button>
  </div>
</div>

<script>
  const defaultData = {
    phoneWatch: "600 00 00 00",
    wifiSsid: "MiFibra_Poio_5G",
    wifiPass: "ClaveWifiCasa2026",
    apnName: "DIGI",
    apnServer: "internet.digimobil.es",
    apnMcc: "214",
    apnMnc: "22",
    sos1: "611 11 11 11",
    sos2: "622 22 22 22",
    sos3: "986 00 00 00",
    contact1: "Papá",
    contact2: "Vanesa",
    appEmail: "tucorreo@gmail.com",
    regCode: "SWPLUS2-884920",
    gpsInterval: "10",
    homeFenceRadius: "250",
    schoolFenceRadius: "300",
    aiFilterLevel: "Estudio y Deberes (10 Años)",
    meteoCity: "Poio (San Salvador)",
    schoolTimeStart: "09:00",
    schoolTimeEnd: "14:00",
    schoolDays: "Lunes a Viernes",
    alarm1Time: "07:45",
    autoShutdown: "22:00",
    autoBoot: "07:30"
  };

  const defaultCompleted = new Array(12).fill(false);

  // 1. Carga inicial: Si hay parámetro en la URL (?sync=...), carga esos datos
  function loadUrlData() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const syncData = urlParams.get('sync');
      if (syncData) {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(syncData))));
        if (decoded.data && decoded.completed) {
          localStorage.setItem("sw_hub_v2_data", JSON.stringify(decoded.data));
          localStorage.setItem("sw_hub_v2_completed", JSON.stringify(decoded.completed));
          return { data: decoded.data, completed: decoded.completed };
        }
      }
    } catch (e) {
      console.error("Error al leer datos de la URL", e);
    }
    return null;
  }

  const fromUrl = loadUrlData();
  let configData = (fromUrl && fromUrl.data) || JSON.parse(localStorage.getItem("sw_hub_v2_data")) || defaultData;
  let completedSteps = (fromUrl && fromUrl.completed) || JSON.parse(localStorage.getItem("sw_hub_v2_completed")) || defaultCompleted;

  const steps = [
    {
      badge: "Fase 1 de 12 • Móvil Tutor",
      title: "Desbloqueo de PIN en SIM Digi",
      instructions: `
        <ol>
          <li>Introduce la Nano-SIM de Digi en tu smartphone habitual.</li>
          <li>Ve a <b>Ajustes > Seguridad > Bloqueo de SIM</b> y desactiva el PIN.</li>
          <li>Desactiva el Wi-Fi en el móvil y abre una página web para validar que el bono de datos funciona.</li>
          <li>Haz una llamada corta de prueba para verificar que la línea emite y recibe voz.</li>
        </ol>
      `,
      dataInputs: [
        { label: "Número SIM Digi del reloj:", key: "phoneWatch", type: "tel" }
      ],
      deviceType: "phone",
      deviceTag: "Ajustes de SIM en Smartphone",
      renderScreen: () => `
        <div class="phone-topbar">Seguridad SIM</div>
        <div class="phone-body">
          <div style="background:#1e293b; padding:8px; border-radius:6px;">
            <span>Bloqueo PIN: </span><b style="color:#f87171;">DESACTIVADO ⚪</b>
          </div>
          <div style="font-size:0.65rem; color:#94a3b8; margin-top:6px;">Línea: <b>${configData.phoneWatch}</b></div>
          <div style="background:#064e3b; padding:6px; border-radius:4px; font-size:0.65rem; color:#a7f3d0; margin-top:8px;">✓ SIM lista para el reloj</div>
        </div>
      `
    },
    {
      badge: "Fase 2 de 12 • Hardware",
      title: "Montaje y Encendido",
      instructions: `
        <ul>
          <li><b>Apaga por completo el reloj</b> antes de abrir la ranura.</li>
          <li>Coloca la Nano-SIM con los pines dorados hacia arriba y la esquina cortada según el dibujo interior.</li>
          <li>Presiona firmemente la tapa de goma para mantener la estanqueidad al agua.</li>
          <li>Mantén pulsado el botón lateral durante 3 segundos para encender el reloj.</li>
        </ul>
      `,
      dataInputs: [
        { label: "RegCode (Pegatina trasera o caja):", key: "regCode", type: "text" }
      ],
      deviceType: "watch",
      deviceTag: "Pantalla SaveWatch Plus 2",
      renderScreen: () => `
        <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:#94a3b8;">
          <span>09:30</span><span style="color:#38bdf8;">📶 SIM OK</span>
        </div>
        <div style="text-align:center; margin:auto 0;">
          <div style="font-size:1.5rem;">⌚</div>
          <div style="font-weight:bold; color:#38bdf8;">SaveWatch Plus 2</div>
          <div style="font-size:0.6rem; color:#94a3b8;">RegCode: ${configData.regCode}</div>
        </div>
        <div style="background:#064e3b; padding:3px; border-radius:4px; font-size:0.6rem; text-align:center; color:#34d399;">● SIM Detectada</div>
      `
    },
    {
      badge: "Fase 3 de 12 • Red Local",
      title: "Wi-Fi del Piso en Poio",
      instructions: `
        <p>Conecta el reloj al Wi-Fi de casa para ahorrar datos móviles y mantener máxima cobertura en interiores:</p>
      `,
      customAction: () => `
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <button class="btn-native" onclick="selectWifi('MiFibra_Poio_5G', 'ClaveWifiCasa2026')">📡 Wi-Fi Poio (5G)</button>
          <button class="btn-native" onclick="selectWifi('MiFibra_Poio_Plus', 'ClaveWifiCasa2026')">📡 Wi-Fi Poio (2.4G)</button>
        </div>
      `,
      dataInputs: [
        { label: "Nombre de Red (SSID):", key: "wifiSsid", type: "text" },
        { label: "Contraseña:", key: "wifiPass", type: "text" }
      ],
      deviceType: "watch",
      deviceTag: "Wi-Fi SaveWatch Plus 2",
      renderScreen: () => `
        <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:#94a3b8;">
          <span>09:32</span><span style="color:#10b981;">🛜 Conectado</span>
        </div>
        <div style="margin:auto 0; text-align:left; font-size:0.65rem;">
          <div style="color:#94a3b8;">RED:</div>
          <div style="font-weight:bold; color:#38bdf8;">${configData.wifiSsid}</div>
          <div style="background:#0f172a; padding:4px; border-radius:4px; margin-top:2px;">Clave: ${configData.wifiPass}</div>
        </div>
        <div style="background:#064e3b; color:#a7f3d0; padding:3px; border-radius:4px; font-size:0.6rem; text-align:center;">✓ Wi-Fi Vinculado</div>
      `
    },
    {
      badge: "Fase 4 de 12 • Red Móvil 4G",
      title: "Configuración de Datos APN Digi",
      instructions: `
        <h4>Método 1: Pantalla Táctil del Reloj (100% Eficaz):</h4>
        <ol>
          <li>En la pantalla del reloj, desliza hasta <b>Ajustes > Ajustes de Red > APN</b>.</li>
          <li>Pulsa en <b>Añadir (+)</b> o edita el perfil existente y rellena:
            <br>• <b>Nombre:</b> <code>DIGI</code>
            <br>• <b>APN:</b> <code>internet.digimobil.es</code>
            <br>• <b>MCC:</b> <code>214</code> | <b>MNC:</b> <code>22</code>
          </li>
          <li>Guarda los cambios, marca el círculo del perfil <b>DIGI</b> y reinicia el reloj.</li>
        </ol>
        <h4 style="margin-top:10px;">Método 2: Enviar Comando SMS desde tu Móvil:</h4>
        <p style="color:#94a3b8; font-size:0.8rem;">Pulsa para abrir tu aplicación de mensajes con el comando oficial ya redactado:</p>
      `,
      customAction: () => `
        <div style="margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap;">
          <a class="btn-native success" id="btn-send-sms" href="sms:${configData.phoneWatch.replace(/\s+/g, '')}?body=pw,123456,apn,internet.digimobil.es,,,21422%23">
            ✉️ SMS Clave 123456
          </a>
          <a class="btn-native" href="sms:${configData.phoneWatch.replace(/\s+/g, '')}?body=pw,523681,apn,internet.digimobil.es,,,21422%23">
            ✉️ SMS Clave 523681
          </a>
          <a class="btn-native" href="sms:${configData.phoneWatch.replace(/\s+/g, '')}?body=pw,123456,ts%23">
            🔍 Test de Diagnóstico TS
          </a>
        </div>
      `,
      dataInputs: [
        { label: "Nombre APN:", key: "apnName", type: "text" },
        { label: "Servidor APN:", key: "apnServer", type: "text" },
        { label: "MCC:", key: "apnMcc", type: "text" },
        { label: "MNC:", key: "apnMnc", type: "text" }
      ],
      deviceType: "watch",
      deviceTag: "Pantalla APN en el Reloj",
      renderScreen: () => `
        <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:#94a3b8;">
          <span>Ajustes > APN</span><span style="color:#38bdf8;">4G Digi</span>
        </div>
        <div style="margin:auto 0; text-align:left; font-size:0.65rem;">
          <div>Nombre: <b style="color:#38bdf8;">${configData.apnName}</b></div>
          <div>APN: <b>${configData.apnServer}</b></div>
          <div>MCC: <b>${configData.apnMcc}</b> | MNC: <b>${configData.apnMnc}</b></div>
          <div style="color:#94a3b8; font-size:0.55rem; margin-top:2px;">Tipo APN: default,supl</div>
        </div>
        <div style="background:#064e3b; color:#a7f3d0; padding:3px; border-radius:4px; font-size:0.6rem; text-align:center;">✓ Datos 4G Guardados</div>
      `
    },
    {
      badge: "Fase 5 de 12 • App Oficial",
      title: "Descarga de SaveFamily",
      instructions: `
        <p>Instala la aplicación oficial en tu teléfono móvil para gestionar el control parental:</p>
      `,
      customAction: () => `
        <div style="margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap;">
          <a class="btn-native" href="https://play.google.com/store/apps/details?id=com.savefamily.app" target="_blank">
            🤖 Google Play (Android)
          </a>
          <a class="btn-native" href="https://apps.apple.com/es/app/savefamily/id1527786438" target="_blank">
            🍏 App Store (iPhone)
          </a>
        </div>
      `,
      dataInputs: [
        { label: "Tu correo en SaveFamily:", key: "appEmail", type: "email" }
      ],
      deviceType: "phone",
      deviceTag: "App SaveFamily",
      renderScreen: () => `
        <div class="phone-topbar">SaveFamily • Login</div>

  let currentStep = 0;

  function renderInputs(inputs, customAction) {
    const container = document.getElementById("data-container");
    container.innerHTML = `<h4>📝 Parámetros & Acciones en Vivo:</h4>`;
    
    if (customAction) {
      container.innerHTML += customAction();
    }

    inputs.forEach(input => {
      const group = document.createElement("div");
      group.className = "form-group";
      group.innerHTML = `
        <label>${input.label}</label>
        <input type="${input.type}" value="${configData[input.key] || ''}" oninput="updateData('${input.key}', this.value)">
      `;
      container.appendChild(group);
    });
  }

  function updateData(key, value) {
    configData[key] = value;
    localStorage.setItem("sw_hub_v2_data", JSON.stringify(configData));
    renderDeviceScreen();
    
    const smsLink = document.getElementById("btn-send-sms");
    if (smsLink && key === "phoneWatch") {
      const cleanPhone = value.replace(/\s+/g, '');
      smsLink.href = `sms:${cleanPhone}?body=pw,123456,apn,internet.digimobil.es,,,21422%23`;
    }
  }

  function selectWifi(ssid, pass) {
    updateData("wifiSsid", ssid);
    updateData("wifiPass", pass);
    updateStepView();
  }

  async function pickNativeContact(keyNumber) {
    if ('contacts' in navigator && 'ContactsManager' in window) {
      try {
        const props = ['name', 'tel'];
        const contacts = await navigator.contacts.select(props, { multiple: false });
        if (contacts.length > 0) {
          const contact = contacts[0];
          const name = contact.name ? contact.name[0] : 'Contacto';
          const tel = contact.tel ? contact.tel[0].replace(/\s+/g, '') : '';
          updateData(keyNumber, `${tel} (${name})`);
          updateStepView();
        }
      } catch (ex) {
        alert("Escribe el teléfono directamente en la casilla.");
      }
    } else {
      alert("Escribe el teléfono directamente en la casilla.");
    }
  }

  function toggleCompletion() {
    completedSteps[currentStep] = !completedSteps[currentStep];
    localStorage.setItem("sw_hub_v2_completed", JSON.stringify(completedSteps));
    updateStepView();
  }

  function renderDeviceScreen() {
    const s = steps[currentStep];
    const wrapper = document.getElementById("device-wrapper");
    document.getElementById("preview-tag").innerText = s.deviceTag;

    if (s.deviceType === "watch") {
      wrapper.innerHTML = `<div class="mockup-watch"><div class="watch-screen">${s.renderScreen()}</div></div>`;
    } else {
      wrapper.innerHTML = `<div class="mockup-phone"><div class="phone-screen">${s.renderScreen()}</div></div>`;
    }
  }

  function updateStepView() {
    const s = steps[currentStep];
    
    document.getElementById("step-badge").innerText = s.badge;
    document.getElementById("step-title").innerText = s.title;
    document.getElementById("instruction-content").innerHTML = s.instructions;

    const isDone = completedSteps[currentStep];
    const chkBox = document.getElementById("chk-done");
    const compBox = document.getElementById("completion-box");
    const chkLabel = document.getElementById("chk-label");

    chkBox.checked = isDone;
    if (isDone) {
      compBox.classList.add("done");
      chkLabel.innerHTML = `✓ Paso <span style="color:var(--accent);">REALIZADO</span> (Guardado)`;
    } else {
      compBox.classList.remove("done");
      chkLabel.innerHTML = `Marcar paso como <b>REALIZADO</b>`;
    }

    renderInputs(s.dataInputs, s.customAction);
    renderDeviceScreen();

    const pills = document.querySelectorAll(".step-pill");
    pills.forEach((p, idx) => {
      p.className = "step-pill";
      if (idx === currentStep) p.classList.add("active");
      if (completedSteps[idx]) {
        p.classList.add("completed");
        p.querySelector("span").innerText = `${idx + 1}. ✓`;
      } else {
        p.querySelector("span").innerText = `${idx + 1}. ${steps[idx].title.split(" ")[0]}`;
      }
    });

    const doneCount = completedSteps.filter(Boolean).length;
    const progressPercent = (doneCount / steps.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    document.getElementById("btn-prev").disabled = (currentStep === 0);
    const nextBtn = document.getElementById("btn-next");
    nextBtn.innerText = currentStep === steps.length - 1 ? (doneCount === steps.length ? "¡12 Fases Completadas! ✓" : "Finalizar") : "Siguiente →";
  }

  function setStep(index) {
    currentStep = index;
    updateStepView();
  }

  function moveStep(delta) {
    const newIdx = currentStep + delta;
    if (newIdx >= 0 && newIdx < steps.length) {
      currentStep = newIdx;
      updateStepView();
    }
  }

  // Sincronización Automática mediante Enlace Compartible
  function shareViaUrl() {
    const backup = { data: configData, completed: completedSteps };
    const jsonStr = JSON.stringify(backup);
    const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
    const shareUrl = `${window.location.origin}${window.location.pathname}?sync=${encoded}`;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("¡Enlace copiado! Pégalo por WhatsApp en el otro móvil o ábrelo en el PC. Se cargarán todos los datos automáticamente.");
      }).catch(() => {
        prompt("Copia este enlace para abrirlo en otro dispositivo:", shareUrl);
      });
    } else {
      prompt("Copia este enlace para abrirlo en otro dispositivo:", shareUrl);
    }
  }

  function exportConfig() {
    const backup = { data: configData, completed: completedSteps };
    const jsonStr = JSON.stringify(backup);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(jsonStr).then(() => {
        alert("¡Código de configuración copiado! Pégalo en el otro dispositivo usando el botón 'Pegar Código'.");
      }).catch(() => {
        prompt("Copia este código de respaldo:", jsonStr);
      });
    } else {
      prompt("Copia este código de respaldo:", jsonStr);
    }
  }

  function importConfig() {
    const jsonStr = prompt("Pega aquí el código de configuración copiado:");
    if (jsonStr) {
      try {
        const backup = JSON.parse(jsonStr);
        if (backup.data && backup.completed) {
          configData = backup.data;
          completedSteps = backup.completed;
          localStorage.setItem("sw_hub_v2_data", JSON.stringify(configData));
          localStorage.setItem("sw_hub_v2_completed", JSON.stringify(completedSteps));
          updateStepView();
          alert("¡Configuración importada con éxito en este dispositivo!");
        } else {
          alert("Los datos no tienen un formato válido.");
        }
      } catch (e) {
        alert("Error al procesar el código. Asegúrate de copiarlo completo.");
      }
    }
  }

  updateStepView();
</script>
