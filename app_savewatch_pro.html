<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SaveWatch+ 2 Ultimate Setup Hub</title>
  <style>
    :root {
      --bg-main: #070b14;
      --bg-card: #111927;
      --bg-card-secondary: #1a2333;
      --bg-input: #0b111e;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #10b981;
      --accent-muted: rgba(16, 185, 129, 0.15);
      --danger: #f87171;
      --warning: #fbbf24;
      --purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-focus: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 12px;
    }

    .app-container {
      max-width: 100%;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 95vh;
    }

    header {
      background: linear-gradient(135deg, #0b111e 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .progress-track {
      background: #1e293b;
      height: 5px;
      width: 100%;
    }
    .progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .step-nav {
      display: flex;
      overflow-x: auto;
      background: #090e17;
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      gap: 6px;
      scrollbar-width: none;
    }
    .step-nav::-webkit-scrollbar { display: none; }

    .step-pill {
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .step-pill.active {
      background: var(--primary);
      color: #070b14;
      border-color: var(--primary);
      font-weight: 700;
    }

    .step-pill.completed {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-muted);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    @media (min-width: 850px) {
      .workspace {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .panel-instructions {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .phase-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--primary);
    }

    .phase-title {
      font-size: 1.15rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .instruction-card {
      background: var(--bg-card-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.85rem;
    }

    .instruction-card ol, .instruction-card ul {
      padding-left: 18px;
      margin-top: 6px;
      color: #cbd5e1;
    }

    .instruction-card li { margin-bottom: 6px; }

    .completion-toggle {
      background: #0b111e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .completion-toggle.done {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--accent);
    }

    .completion-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .completion-toggle label {
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    .data-box {
      background: #0b111e;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .data-box h4 {
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-input);
      color: #ffffff;
      outline: none;
    }

    .form-group input:focus { border-color: var(--primary); }

    .btn-native {
      background: #1e293b;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn-native:hover {
      background: var(--primary);
      color: #070b14;
    }

    .btn-native.success {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-muted);
    }

    .btn-native.purple {
      color: var(--purple);
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.15);
    }

    .panel-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .mockup-watch {
      width: 230px;
      height: 265px;
      background: #020617;
      border-radius: 40px;
      border: 4px solid #334155;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .watch-screen {
      background: #000000;
      flex: 1;
      border-radius: 26px;
      padding: 8px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.7rem;
    }

    .mockup-phone {
      width: 230px;
      height: 330px;
      background: #020617;
      border-radius: 32px;
      border: 3px solid #334155;
      padding: 6px;
      display: flex;
      flex-direction: column;
    }

    .phone-screen {
      background: #0f172a;
      flex: 1;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      font-size: 0.7rem;
    }

    .phone-topbar {
      background: #1e293b;
      color: var(--primary);
      padding: 6px;
      font-weight: bold;
      text-align: center;
    }

    .phone-body {
      padding: 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: #090e17;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--primary); color: #070b14; }
    .btn-secondary { background: #1e293b; color: var(--text-main); }
    .btn:disabled { background: #111927; color: #475569; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div>
      <h1>SaveWatch Plus 2 • Setup Hub Pro</h1>
      <p>Red Digi Mobil • Poio • IA, MeteoKid, WhatsApp, GPS & Control Total</p>
    </div>
  </header>

  <div class="progress-track">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="step-nav" id="step-nav">
    <button class="step-pill active" onclick="setStep(0)"><span>1. SIM</span></button>
    <button class="step-pill" onclick="setStep(1)"><span>2. Hardware</span></button>
    <button class="step-pill" onclick="setStep(2)"><span>3. Wi-Fi</span></button>
    <button class="step-pill" onclick="setStep(3)"><span>4. APN & SMS</span></button>
    <button class="step-pill" onclick="setStep(4)"><span>5. App Oficial</span></button>
    <button class="step-pill" onclick="setStep(5)"><span>6. Agenda SOS</span></button>
    <button class="step-pill" onclick="setStep(6)"><span>7. GPS & Calibración</span></button>
    <button class="step-pill" onclick="setStep(7)"><span>8. WhatsApp Pro</span></button>
    <button class="step-pill" onclick="setStep(8)"><span>9. IA Educativa</span></button>
    <button class="step-pill" onclick="setStep(9)"><span>10. MeteoKid</span></button>
    <button class="step-pill" onclick="setStep(10)"><span>11. Modo Clase</span></button>
    <button class="step-pill" onclick="setStep(11)"><span>12. Rutinas</span></button>
  </div>

  <div class="workspace">
    <div class="panel-instructions">
      <div>
        <span class="phase-badge" id="step-badge">Fase 1 / 12</span>
        <h2 class="phase-title" id="step-title"></h2>
      </div>

      <div class="completion-toggle" id="completion-box" onclick="toggleCompletion()">
        <input type="checkbox" id="chk-done" onclick="event.stopPropagation(); toggleCompletion();">
        <label for="chk-done" id="chk-label">Marcar paso como REALIZADO</label>
      </div>

      <div class="instruction-card" id="instruction-content"></div>
      <div class="data-box" id="data-container"></div>
    </div>

    <div class="panel-preview">
      <span style="font-size:0.7rem; color:var(--text-muted); margin-bottom:8px;" id="preview-tag"></span>
      <div id="device-wrapper"></div>
    </div>
  </div>

  <div class="nav-footer">
    <button class="btn btn-secondary" id="btn-prev" onclick="moveStep(-1)" disabled>Anterior</button>
    <button class="btn btn-primary" id="btn-next" onclick="moveStep(1)">Siguiente</button>
  </div>
</div>

<script>
  const defaultData = {
    phoneWatch: "600 00 00 00",

    sos3Name: "Casa",

  const steps = [
    {
      badge: "Fase 1 de 12 • Móvil Tutor",

        { label: "Número SIM Digi del reloj:", key: "phoneWatch", type: "tel" }
      ],
      deviceType: "phone",
      deviceTag: "Ajustes de SIM",
      renderScreen: () => `
        <div class="phone-topbar">Seguridad SIM</div>

          <div style="background:#1e293b; padding:8px; border-radius:6px;">

      dataInputs: [

      renderScreen: () => `

    {

      customAction: () => `

      renderScreen: () => `

          <span>09:32</span><span style="color:#10b981;">🛜 Conectado</span>

    {

      dataInputs: [

        { label: "SOS 3 (Casa / Abuelos):", key: "sos3", type: "text" }

      deviceType: "phone",
      deviceTag: "Agenda & SOS",
      renderScreen: () => `

          <div style="background:#1e293b; padding:4px; border-radius:4px; font-size:0.6rem;">1. ${configData.sos1}</div>
          <div style="background:#1e293b; padding:4px; border-radius:4px; font-size:0.6rem;">2. ${configData.sos2}</div>

      `
    },
    {
      badge: "Fase 7 de 12 • Ubicación Multicapa",
      title: "Calibración GPS y Geovallas",
      instructions: `
        <h4>Sistema de Localización Triple:</h4>
        <ol>
          <li><b>GPS Satelital:</b> Máxima precisión (±5m) en exteriores.</li>

        </ol>
      `,
      dataInputs: [
        { label: "Intervalo GPS (minutos):", key: "gpsInterval", type: "number" },
        { label: "Radio Geovalla Casa (metros):", key: "homeFenceRadius", type: "number" },
        { label: "Radio Geovalla Colegio (metros):", key: "schoolFenceRadius", type: "number" }
      ],
      deviceType: "phone",
      deviceTag: "Mapa GPS SaveFamily",
      renderScreen: () => `
        <div class="phone-topbar">GPS Satelital Multi-Modo</div>
        <div class="phone-body">
          <div style="background:#1e293b; padding:6px; border-radius:4px; text-align:center;">
            <div style="color:#38bdf8; font-weight:bold; font-size:0.7rem;">📍 Poio, San Salvador</div>

  let currentStep = 0;

  function renderInputs(inputs, customAction) {
    const container = document.getElementById("data-container");
    container.innerHTML = `<h4>📝 Parámetros & Acciones en Vivo:</h4>`;
    
    if (customAction) {
      container.innerHTML += customAction();
    }

    inputs.forEach(input => {
      const group = document.createElement("div");
      group.className = "form-group";
      group.innerHTML = `
        <label>${input.label}</label>
        <input type="${input.type}" value="${configData[input.key] || ''}" oninput="updateData('${input.key}', this.value)">
      `;
      container.appendChild(group);
    });
  }

  function updateData(key, value) {
    configData[key] = value;
    localStorage.setItem("sw_pro12_data", JSON.stringify(configData));
    renderDeviceScreen();
    
    const smsLink = document.getElementById("btn-send-sms");
    if (smsLink && key === "phoneWatch") {
      const cleanPhone = value.replace(/\s+/g, '');
      smsLink.href = `sms:${cleanPhone}?body=pw,123456,apn,internet.digimobil.es,,,21422%23`;
    }
  }

  function selectWifi(ssid, pass) {
    updateData("wifiSsid", ssid);
    updateData("wifiPass", pass);
    updateStepView();
  }

  async function pickNativeContact(keyNumber) {
    if ('contacts' in navigator && 'ContactsManager' in window) {
      try {
        const props = ['name', 'tel'];
        const contacts = await navigator.contacts.select(props, { multiple: false });
        if (contacts.length > 0) {
          const contact = contacts[0];
          const name = contact.name ? contact.name[0] : 'Contacto';
          const tel = contact.tel ? contact.tel[0].replace(/\s+/g, '') : '';
          updateData(keyNumber, `${tel} (${name})`);
          updateStepView();
        }
      } catch (ex) {
        alert("Selección manual: escribe el teléfono en la casilla.");
      }
    } else {
      alert("Introduce el número de teléfono directamente en la casilla.");
    }
  }

  function toggleCompletion() {
    completedSteps[currentStep] = !completedSteps[currentStep];
    localStorage.setItem("sw_pro12_completed", JSON.stringify(completedSteps));
    updateStepView();
  }

  function renderDeviceScreen() {
    const s = steps[currentStep];
    const wrapper = document.getElementById("device-wrapper");
    document.getElementById("preview-tag").innerText = s.deviceTag;

    if (s.deviceType === "watch") {
      wrapper.innerHTML = `<div class="mockup-watch"><div class="watch-screen">${s.renderScreen()}</div></div>`;
    } else {
      wrapper.innerHTML = `<div class="mockup-phone"><div class="phone-screen">${s.renderScreen()}</div></div>`;
    }
  }

  function updateStepView() {
    const s = steps[currentStep];
    
    document.getElementById("step-badge").innerText = s.badge;
    document.getElementById("step-title").innerText = s.title;
    document.getElementById("instruction-content").innerHTML = s.instructions;

    const isDone = completedSteps[currentStep];
    const chkBox = document.getElementById("chk-done");
    const compBox = document.getElementById("completion-box");
    const chkLabel = document.getElementById("chk-label");

    chkBox.checked = isDone;
    if (isDone) {
      compBox.classList.add("done");
      chkLabel.innerHTML = `✓ Paso <span style="color:var(--accent);">REALIZADO</span> (Guardado)`;
    } else {
      compBox.classList.remove("done");
      chkLabel.innerHTML = `Marcar paso como <b>REALIZADO</b>`;
    }

    renderInputs(s.dataInputs, s.customAction);
    renderDeviceScreen();

    const pills = document.querySelectorAll(".step-pill");
    pills.forEach((p, idx) => {
      p.className = "step-pill";
      if (idx === currentStep) p.classList.add("active");
      if (completedSteps[idx]) {
        p.classList.add("completed");
        p.querySelector("span").innerText = `${idx + 1}. ✓`;
      } else {
        p.querySelector("span").innerText = `${idx + 1}. ${steps[idx].title.split(" ")[0]}`;
      }
    });

    const doneCount = completedSteps.filter(Boolean).length;
    const progressPercent = (doneCount / steps.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    document.getElementById("btn-prev").disabled = (currentStep === 0);
    const nextBtn = document.getElementById("btn-next");
    nextBtn.innerText = currentStep === steps.length - 1 ? (doneCount === steps.length ? "¡12 Fases Completadas! ✓" : "Finalizar") : "Siguiente →";
  }

  function setStep(index) {
    currentStep = index;
    updateStepView();
  }

  function moveStep(delta) {
    const newIdx = currentStep + delta;
    if (newIdx >= 0 && newIdx < steps.length) {
      currentStep = newIdx;
      updateStepView();
    }
  }

  updateStepView();
</script>
